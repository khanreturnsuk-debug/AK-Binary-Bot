<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK Premium Bot Web</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0F172A; color: white; text-align: center; padding: 20px; }
        .card { background: #1E293B; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; }
        select, button { padding: 10px; margin: 10px; border-radius: 8px; border: none; font-size: 16px; }
        .signal { font-size: 24px; font-weight: bold; margin-top: 15px; }
        .CALL { color: #22c55e; }
        .PUT { color: #ef4444; }
    </style>
</head>
<body>
    <h2>AK Premium Bot Dashboard</h2>
    <div class="card">
        <label>Pair:</label>
        <select id="pair">
            <option value="EURUSD">EURUSD</option>
            <option value="GBPUSD">GBPUSD</option>
            <option value="USDJPY">USDJPY</option>
            <option value="USDCAD">USDCAD</option>
        </select>
        <br>
        <label>Timeframe:</label>
        <select id="tf">
            <option value="1m">1 Minute</option>
            <option value="5m">5 Minutes</option>
        </select>
        <br>
        <button onclick="getSignal()" style="background: #6366F1; color: white; cursor: pointer;">Get Signal</button>
        <div id="result" class="signal">Select pair & click Get Signal</div>
    </div>

    <script>
        async function getSignal() {
            const pair = document.getElementById('pair').value;
            const tf = document.getElementById('tf').value;
            const resDiv = document.getElementById('result');
            resDiv.innerText = "Loading signal...";
            
            // Fixed HTTPS Proxy & Endpoint parameters
            const targetUrl = `https://akprimiumebot.pythonanywhere.com/signal?symbol=${pair}&interval=${tf}`;
            
            try {
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                if (data.direction) {
                    resDiv.innerHTML = `<span class="${data.direction}">${data.direction}</span><br><small style="font-size:14px; color:#aaa;">Accuracy: ${data.accuracy}%</small>`;
                } else {
                    resDiv.innerText = "Failed to load signal data";
                }
            } catch (e) {
                // Fallback attempt via proxy if HTTPS/CORS is strict on mobile
                try {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                    const proxyRes = await fetch(proxyUrl);
                    const proxyData = await proxyRes.json();
                    const data = JSON.parse(proxyData.contents);
                    
                    if (data.direction) {
                        resDiv.innerHTML = `<span class="${data.direction}">${data.direction}</span><br><small style="font-size:14px; color:#aaa;">Accuracy: ${data.accuracy}%</small>`;
                    } else {
                        resDiv.innerText = "Failed to load signal data";
                    }
                } catch (err) {
                    resDiv.innerText = "Error connecting to server";
                }
            }
        }
    </script>
</body>
</html>
